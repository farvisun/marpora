[workspace]
resolver = "3"
members = ["crates/md", "crates/core", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
comrak = { version = "0.59", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ropey = "1.6"
thiserror = "2"
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
