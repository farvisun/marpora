name: Feature request
description: Something Marpora should do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: What you're trying to do, and how Marpora could help.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: How you do it today
      description: A workaround, or another app that does it well.
