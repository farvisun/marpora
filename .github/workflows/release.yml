name: Release

# Pushing a version tag (`git tag v1.2.3 && git push origin v1.2.3`) builds a universal
# macOS app (Apple Silicon and Intel), ad-hoc signed, and publishes it as a GitHub
# release with the update feed (`latest.json`) the app's updater reads.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen version in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Check the tag matches the app's version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but Cargo.toml has $version"; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update archives; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # From the root, where tauri-action finds src-tauri; web's `tauri` script runs
          # the CLI there too.
          projectPath: .
          tauriScript: pnpm --dir web tauri
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Marpora ${{ github.ref_name }}
          releaseBody: |
            Download **Marpora.dmg**, open it and drag Marpora to Applications. It runs on macOS 12 or later, on Apple Silicon and Intel Macs.

            Marpora is ad-hoc signed, not notarized, so macOS blocks its first launch. Open **System Settings › Privacy & Security** and click **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/Marpora.app`. Later versions install from inside the app (**Marpora › Check for Updates…**).
          releaseDraft: true
          includeUpdaterJson: true

      # A name without the version, so https://github.com/farvisun/marpora/releases/latest/download/Marpora.dmg
      # always gets the newest app.
      - name: Upload Marpora.dmg and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" Marpora.dmg
          gh release upload "$GITHUB_REF_NAME" Marpora.dmg --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
