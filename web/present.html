<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slides</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: fixed; inset: 0; cursor: default; }
      body.black #stage { visibility: hidden; }
      body.idle, body.idle #stage { cursor: none; }
      #ended { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #aaa; font: 16px -apple-system, system-ui, sans-serif; background: #000; }
      #ended[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ended" hidden>End of slide show</div>
    <script type="module" src="/src/present/main.ts"></script>
  </body>
</html>
