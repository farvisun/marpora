[package]
name = "marpora"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast Markdown editor"

[lib]
name = "marpora_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
marpora-core = { path = "../crates/core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSGeometry", "NSError", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKNavigationDelegate", "WKNavigation"] }
